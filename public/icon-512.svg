<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" stroke="url(#glow)" stroke-width="4" stroke-opacity="0.3"/>
  
  <g filter="url(#shadow)">
    <!-- G and Code bracket styled symbol -->
    <path d="M160 170 C160 170 120 220 120 256 C120 292 160 342 160 342" stroke="url(#glow)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M352 170 C352 170 392 220 392 256 C392 292 352 342 352 342" stroke="url(#glow)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M290 160 L222 352" stroke="#38bdf8" stroke-width="32" stroke-linecap="round"/>
    <!-- AI Sparkle -->
    <circle cx="360" cy="150" r="16" fill="#f43f5e" />
    <circle cx="380" cy="130" r="8" fill="#fbbf24" />
  </g>
</svg>
